<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>I'M FRIDGE — art export</title>
<style>
  body { background: #1c1720; color: #f4e9dc; font: 14px system-ui, sans-serif; margin: 16px; }
  #out img { image-rendering: pixelated; margin: 4px; background: repeating-conic-gradient(#3a3040 0 25%, #2a2432 0 50%) 0 0 / 16px 16px; }
</style>
</head>
<body>
<!-- Art export for Photoshop mockups. Open through tools/devserver.py and call exportAll() (the scratchpad runner does this).
     Every piece is drawn by the game's own code, cropped, on a clear background. © 2026 Void Possum. All rights reserved. -->
<p>Art export: each piece at its real pixel size (the runner also saves a 4× copy).</p>
<canvas id="scene" hidden></canvas>
<canvas id="tight" hidden></canvas>
<div id="out"></div>
<script src="../js/data/core.js"></script>
<script src="../js/data/cards.js"></script>
<script src="../js/data/rivals.js"></script>
<script src="../js/data/story.js"></script>
<script src="../js/data/machine.js"></script>
<script src="../js/data/hardware.js"></script>
<script src="../js/data/research.js"></script>
<script src="../js/data/tree.js"></script>
<script src="../js/data/news.js"></script>
<script src="../js/data/side.js"></script>
<script src="../js/data/chips.js"></script>
<script src="../js/engine.js"></script>
<script src="../js/sprites.js"></script>
<script src="../js/scene.js"></script>
<script>
  // ch2mock.js draws its mockups only when its canvases exist; here we only want its drawing functions.
  document.getElementById('tight').id = 'tight-off';
</script>
<script src="ch2mock.js"></script>
<script>
(function () {
  'use strict';
  var t = 3.3, out = [];

  // Draw on a big clear canvas, then crop to the pixels that were drawn.
  function piece(name, w, h, draw) {
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    var g = c.getContext('2d'); g.imageSmoothingEnabled = false;
    draw(g);
    var d = g.getImageData(0, 0, w, h).data, x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3]) {
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
    if (x1 < 0) return;
    var o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
    o.getContext('2d').drawImage(c, -x0, -y0);
    var o4 = document.createElement('canvas'); o4.width = o.width * 4; o4.height = o.height * 4;
    var g4 = o4.getContext('2d'); g4.imageSmoothingEnabled = false; g4.drawImage(o, 0, 0, o4.width, o4.height);
    out.push({ name: name, url: o.toDataURL('image/png'), url4: o4.toDataURL('image/png'), w: o.width, h: o.height });
  }
  function machine(id, extra) {
    return function (g) {
      g.translate(0, -90);
      var info = { id: id, stock: { cola: 9, lemon: 7, orange: 10, grape: 6 }, cap: 12, t: t, cold: 1,
                   drinks: id === 'you' ? ['cola', 'lemon', 'orange', 'grape'] : ['cola', 'lemon', 'orange'], up: {}, rup: {} };
      for (var k in extra || {}) info[k] = extra[k];
      Sprites.machine(g, 60, info);
    };
  }

  window.exportAll = function () {
    out = [];
    // ── soda machines
    piece('machine-vend3', 120, 140, machine('you', { name: 'VEND-3' }));
    piece('machine-vend3-sign', 120, 140, machine('you', { name: 'VEND-3', up: { sign: 3 }, hw: { fan: 1, ram: 1 }, pps: 3 }));
    piece('machine-chuggpt', 120, 140, machine('chug'));
    piece('machine-clawd', 120, 140, machine('clawd'));
    ['smirk', 'spicy', 'roast'].forEach(function (m) {
      piece('machine-grog-' + m, 120, 140, function (g) { g.translate(0, -90); Mock.grogMachine(g, 60, m, t, {}); });
    });
    // ── your side machines (red, smaller)
    ['snack', 'claw', 'coffee', 'ice'].forEach(function (k) {
      piece('side-' + k, 80, 100, function (g) { g.translate(0, -120); Mock.sideMachine(g, 40, k, t); });
    });
    piece('machine-covered-soon', 120, 140, function (g) { g.translate(0, -90); Mock.coveredMachine(g, 60, t); });
    // ── props
    piece('lamp', 80, 140, function (g) { g.translate(0, -80); Mock.lamp(g, 40, 199, false); });
    piece('lamp-lit', 100, 160, function (g) { g.translate(0, -70); Mock.lamp(g, 50, 199, true); });
    piece('news-board', 160, 60, function (g) { Sprites.tv(g, 10, 10, 136, 36, t, false); });
    piece('crate', 40, 30, function (g) { Sprites.crate(g, 10, 8, false); });
    piece('drone', 30, 20, function (g) { Sprites.drone(g, 15, 8, 0, '#e0483f'); });
    // ── people: every customer type, 3 looks each, plus a follower (phone) and a trending customer
    Object.keys(DATA.customers).forEach(function (type) {
      [11, 4242, 90210].forEach(function (look, n) {
        piece('person-' + type + '-' + (n + 1), 40, 60, function (g) {
          Sprites.person(g, { id: n, type: type, look: look, x: 20, y: 50, tx: 20, ty: 50, st: 'queue', m: 0, fol: -1, sipT: 0 }, 0, { weather: 'normal' });
        });
      });
    });
    piece('person-follower', 40, 60, function (g) { Sprites.person(g, { id: 7, type: 'intern', look: 777, x: 20, y: 50, tx: 20, ty: 50, st: 'queue', m: 0, fol: 1, sipT: 0 }, 0, { weather: 'normal' }); });
    piece('person-trending', 60, 70, function (g) { Sprites.person(g, { id: 8, type: 'office', look: 999, x: 30, y: 60, tx: 30, ty: 60, st: 'queue', m: 0, fol: -1, sipT: 0, gold: true }, 0, { weather: 'normal' }); });
    // ── the park itself (the game's own drawing): with trees, without trees, and the trees alone
    var cv = document.getElementById('scene');
    Scene.init(cv); Scene.resize(480, 270);
    [['day', 11.5], ['dusk', 18.6], ['night', 22.5]].forEach(function (tm) {
      var S = Engine.newGame(7); Engine.closeInfo(S);
      S.run.weather = 'normal'; S.run.dayT = DATA.balance.dayLength * (tm[1] - 6) / 18;
      [['full', 'park-' + tm[0]], ['park', 'park-' + tm[0] + '-no-trees'], ['trees', 'trees-' + tm[0]]].forEach(function (L) {
        Scene.exportLayer(S, t, L[0]);
        piece(L[1], 480, 270, function (g) { g.drawImage(cv, 0, 0); });
      });
    });
    var box = document.getElementById('out'); box.innerHTML = '';
    out.forEach(function (p) { var im = new Image(); im.src = p.url; im.title = p.name + ' ' + p.w + '×' + p.h; box.appendChild(im); });
    return out;
  };
})();
</script>
</body>
</html>
