<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>I'm Fridge — game data</title>
<!-- The game data wiki: every upgrade, card, rival and balance number, read from js/data/*.js.
     Edit any value, then "Export changes" gives a list to send. Nothing here changes the game itself.
     Opened from the game with the Konami code. © 2026 Void Possum. All rights reserved. -->
<style>
  :root { --bg: #1c1720; --panel: #262030; --panel2: #2e2738; --line: #3e3448; --text: #f4e9dc; --dim: #a89cb0; --gold: #ffd24a; --red: #e0483f; --edit: #3a3320; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  a { color: var(--gold); }
  header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 16px; background: #15111a; border-bottom: 2px solid var(--line); }
  header h1 { font-size: 17px; margin: 0 8px 0 0; letter-spacing: .02em; }
  header h1 small { color: var(--dim); font-weight: 400; font-size: 12px; margin-left: 6px; }
  header .grow { flex: 1; }
  header input[type=search] { background: var(--panel); border: 2px solid var(--line); color: var(--text); padding: 6px 10px; min-width: 220px; font: inherit; }
  button { background: var(--panel2); color: var(--text); border: 2px solid var(--line); padding: 6px 12px; font: 600 13px system-ui, sans-serif; cursor: pointer; }
  button:hover { border-color: var(--gold); }
  button.primary { background: #6a2c2c; border-color: #a8362f; }
  button .n { display: inline-block; min-width: 18px; margin-left: 4px; padding: 0 5px; background: var(--gold); color: #1c1720; border-radius: 9px; font-size: 11px; }
  #layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); }
  nav { position: sticky; top: 56px; align-self: start; height: calc(100vh - 56px); overflow: auto; padding: 14px 10px; border-right: 2px solid var(--line); }
  nav a { display: block; padding: 5px 8px; color: var(--text); text-decoration: none; border-left: 3px solid transparent; }
  nav a:hover, nav a.on { border-left-color: var(--gold); background: var(--panel); }
  nav .help { margin-top: 18px; color: var(--dim); font-size: 12px; }
  main { padding: 10px 22px 60px; min-width: 0; }
  section { margin: 0 0 34px; }
  h2 { font-size: 22px; margin: 22px 0 6px; padding-bottom: 4px; border-bottom: 2px solid var(--line); }
  h3 { font-size: 15px; margin: 18px 0 6px; color: var(--gold); }
  .intro { color: var(--dim); margin: 0 0 8px; max-width: 980px; }
  .txt { max-width: 980px; margin: 6px 0; }
  .note { color: var(--dim); font-size: 12px; margin: 4px 0 0; max-width: 980px; }
  .tw { overflow-x: auto; border: 2px solid var(--line); background: var(--panel); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; background: var(--panel2); color: var(--dim); font-weight: 600; padding: 6px 8px; white-space: nowrap; position: sticky; top: 0; }
  td { padding: 5px 8px; border-top: 1px solid var(--line); vertical-align: top; }
  tr:hover td { background: #2c2536; }
  td.small { font-size: 11.5px; color: var(--dim); min-width: 160px; }
  td .nm { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .ico { width: 24px; height: 24px; image-rendering: pixelated; vertical-align: middle; }
  .ed { display: inline-block; min-width: 2.2em; padding: 0 3px; border-bottom: 1px dashed #6a5a78; outline: none; cursor: text; }
  .ed:hover { background: #342c40; }
  .ed:focus { background: #1a1620; border-bottom-color: var(--gold); }
  .ed.num, .ed.money, .ed.list { font-family: ui-monospace, Menlo, Consolas, monospace; white-space: nowrap; }
  .ed.changed { background: var(--edit); border-bottom: 2px solid var(--gold); color: #fff3c0; }
  .sub { display: block; margin-top: 2px; font-size: 11.5px; color: var(--dim); }
  .swatch { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; border: 1px solid #000; }
  textarea.notes { width: 100%; max-width: 980px; min-height: 60px; margin-top: 10px; background: #1a1620; color: var(--text); border: 2px dashed var(--line); padding: 8px; font: 13px/1.4 system-ui, sans-serif; }
  .hide { display: none !important; }
  #modal { position: fixed; inset: 0; background: rgba(10, 6, 14, .75); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #modal .box { width: min(900px, 94vw); background: var(--panel); border: 2px solid var(--line); padding: 16px; }
  #modal textarea { width: 100%; height: 55vh; background: #15111a; color: var(--text); border: 2px solid var(--line); font: 12.5px/1.45 ui-monospace, Menlo, Consolas, monospace; padding: 10px; }
  #modal .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  .banner { background: #2c2416; border: 2px solid #6a5420; padding: 8px 12px; margin: 12px 0; max-width: 980px; }
  @media (max-width: 800px) { #layout { grid-template-columns: 1fr; } nav { position: static; height: auto; border-right: 0; border-bottom: 2px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>I'm Fridge — game data <small id="ver"></small></h1>
  <input type="search" id="q" placeholder="Search (name, number, text)…" aria-label="Search">
  <span class="grow"></span>
  <button class="primary" id="bExport">Export changes<span class="n" id="nEd">0</span></button>
  <button id="bUndo">Undo all changes</button>
  <button id="bDoc">Download document</button>
</header>
<div id="layout">
  <nav id="nav"></nav>
  <main id="main"><p>Loading…</p></main>
</div>
<div id="modal" class="hide"><div class="box">
  <h3 id="mTitle">Your changes</h3>
  <textarea id="mText" readonly></textarea>
  <div class="foot"><button id="mCopy">Copy</button><button id="mSave">Download .txt</button><button class="primary" id="mClose">Close</button></div>
</div></div>
<script src="../js/data/core.js"></script>
<script src="../js/data/cards.js"></script>
<script src="../js/data/rivals.js"></script>
<script src="../js/data/story.js"></script>
<script src="../js/data/machine.js"></script>
<script src="../js/data/hardware.js"></script>
<script src="../js/data/research.js"></script>
<script src="../js/data/tree.js"></script>
<script src="../js/data/news.js"></script>
<script src="../js/icons.js"></script>
<script src="describe.js"></script>
<script src="wiki.js"></script>
</body>
</html>
